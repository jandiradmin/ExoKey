name: ExoKeyMobile
options:
  bundleIdPrefix: com.jandiradmin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: RU5B5M38AJ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ExoKeyMobile:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jandiradmin.exokeymobile]
    dependencies:
      - target: ExoKeyKeyboard
    scheme:
      testTargets: [ExoKeyMobileUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ExoKey
        NSContactsUsageDescription: ExoKey подсказывает имена и e-mail ваших контактов при наборе. Данные остаются на iPhone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jandiradmin.exokeymobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ExoKeyMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ExoKeyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jandiradmin.exokeymobile.uitests
        TEST_TARGET_NAME: ExoKeyMobile
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: UITests/EventSynth.h
  ExoKeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: ../Sources/ExoKey/WordDictionary.swift
      - path: ../data/dict/ru.exd
        buildPhase: resources
      - path: ../data/dict/en.exd
        buildPhase: resources
      - path: Resources/ru.unv
        buildPhase: resources
      - path: Resources/en.unv
        buildPhase: resources
      - path: Resources/ru.nam
        buildPhase: resources
      - path: Resources/en.nam
        buildPhase: resources
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jandiradmin.exokeymobile]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: ExoKey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ru-RU
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jandiradmin.exokeymobile.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
